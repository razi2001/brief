name: Bug
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1.
        2.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Hosted (cloud.get-brief.app)
        - Self-hosted
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Extension 1.8.3, Chrome 142, Linear
  - type: input
    id: share
    attributes:
      label: Brief share link
      description: Recorded it with Brief? Paste the link only if you're fine with us seeing it.
