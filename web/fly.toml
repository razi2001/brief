app = 'brief-cloud'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = 'pk_live_Y2xlcmsuZ2V0LWJyaWVmLmFwcCQ'
    NEXT_PUBLIC_CLERK_SIGN_IN_URL = '/sign-in'
    NEXT_PUBLIC_CLERK_SIGN_UP_URL = '/sign-up'
    NEXT_PUBLIC_SUPABASE_URL = 'https://zoztsincbmaozuulcfez.supabase.co'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'get'
    path = '/sign-in'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
