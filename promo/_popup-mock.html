<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=360, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <!-- Renders the REAL Brief Cloud popup with the actual extension stylesheet
         and sample data, isolated in its own document so popup.css's html/body
         rules don't leak into the screenshot page. screen-popup.html iframes
         this and scales it up as the device shot. -->
    <link rel="stylesheet" href="../extension/fonts.css" />
    <link rel="stylesheet" href="../extension/popup.css" />
    <style>
      /* Override popup.css's html/body rules (width:360px, opacity:0 gate) so the
         popup renders reliably as a standalone framed shot. */
      html, body { width:auto !important; max-width:none !important; margin:0 !important;
        background: transparent !important; opacity:1 !important; }
      /* Round the popup's corners for the framed device shot. */
      #app { width:360px; border-radius: 16px; background: var(--cream); overflow: hidden; }
      /* Mic chip (matches .desc-mic, inlined so the mock needs no JS). */
      .mock-mic { position:absolute; top:8px; right:8px; width:28px; height:28px; border:0; border-radius:50%;
        background:rgba(26,22,18,.05); color:var(--muted); display:grid; place-items:center; }
      .mock-mic svg { width:14px; height:14px; }
    </style>
  </head>
  <body class="ready">
    <main class="app" id="app">
      <header class="header">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 128 128" width="34" height="34">
            <rect x="0" y="0" width="128" height="128" rx="28" fill="#dd6936"/>
            <path fill="#f5f1e8" d="M26 38 Q26 26 38 26 L52 26 L52 34 L40 34 Q34 34 34 40 L34 52 L26 52 Z M26 90 Q26 102 38 102 L52 102 L52 94 L40 94 Q34 94 34 88 L34 76 L26 76 Z M102 90 Q102 102 90 102 L76 102 L76 94 L88 94 Q94 94 94 88 L94 76 L102 76 Z"/>
            <path fill="#f5f1e8" d="M64 40 C67 52, 76 61, 88 64 C76 67, 67 76, 64 88 C61 76, 52 67, 40 64 C52 61, 61 52, 64 40 Z"/>
            <g fill="#ffffff"><ellipse cx="84" cy="40" rx="8" ry="7"/><ellipse cx="95" cy="35" rx="10" ry="9"/><ellipse cx="104" cy="40" rx="7" ry="6"/><rect x="80" y="38" width="28" height="9" rx="4"/></g>
          </svg>
        </span>
        <h1 class="title">What's the <em>brief</em>?</h1>
        <div class="header-actions">
          <button class="hbtn reset-btn" type="button" aria-label="Reset brief">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="hbtn cloud-btn" type="button" aria-label="Open Brief Cloud">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.6A3.5 3.5 0 0 1 18 18Z"/></svg>
          </button>
        </div>
      </header>

      <section class="part">
        <div class="part-label">Evidence <span class="count">2</span></div>
        <div class="gallery">
          <div class="tile shot">
            <span class="badge">1</span>
            <button class="remove" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
            <div class="thumb">
              <svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
                <rect width="120" height="90" fill="#fbfaf7"/><rect width="120" height="13" fill="#ece6d6"/>
                <circle cx="8" cy="6.5" r="2" fill="#dd6936"/>
                <rect x="10" y="26" width="62" height="5" rx="2" fill="#d9d2c4"/><rect x="10" y="38" width="86" height="5" rx="2" fill="#d9d2c4"/>
                <rect x="10" y="56" width="48" height="7" rx="2" fill="#e7c9b8"/>
                <ellipse cx="62" cy="59" rx="30" ry="11" fill="none" stroke="#dd2d2d" stroke-width="1.6"/>
              </svg>
            </div>
            <div class="note-strip"><span class="ntxt">Coupon rejects a valid code</span></div>
          </div>
          <div class="tile rec">
            <button class="remove" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
            <div class="thumb">
              <svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
                <rect width="120" height="90" fill="#2a2622"/><rect width="120" height="13" fill="#1f1b18"/>
                <rect x="10" y="28" width="72" height="5" rx="2" fill="#5a5249"/><rect x="10" y="40" width="94" height="5" rx="2" fill="#4a433b"/><rect x="10" y="52" width="58" height="5" rx="2" fill="#4a433b"/>
              </svg>
              <span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
            </div>
            <div class="rec-foot"><span class="updot"></span>Recording</div>
          </div>
          <div class="tile add">
            <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
            <span class="add-lbl">Add</span>
          </div>
        </div>
      </section>

      <section class="part">
        <div class="part-label">Additional data</div>
        <div class="ai-wrap">
          <textarea class="ai-field has-mic" readonly>Coupon SAVE20 returns "invalid" at checkout, but it's active in the dashboard. Started this morning.</textarea>
          <button class="mock-mic" type="button" aria-label="Record a voice note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1.5a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0v-7a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg></button>
        </div>
        <div class="sheet-fields">
          <div class="sheet-field">
            <input class="k" value="environment" readonly />
            <input class="v" value="production" readonly />
            <button class="fx" aria-label="Remove field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
        </div>
        <button class="addfield" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add field</button>
      </section>

      <div class="create-wrap">
        <button class="create" type="button"><span class="ctk-label">Create ticket</span></button>
      </div>
    </main>
  </body>
</html>
