<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Brief - Microphone access</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      /* The one setup step: allow the microphone. Same look as the popup and
         the app's sign-in: the brand on the cream, one small card, one button. */
      :root {
        --cream: #f5f1e8;
        --card: #fffdfa;
        --ink: #1a1612;
        --ink-2: #3a3530;
        --muted: #7d766b;
        --accent: #dd6936;
        --hairline: rgba(26, 22, 18, 0.12);
        --display: 'Instrument Serif', Georgia, serif;
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        --t: 180ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      [hidden] { display: none !important; }
      html, body {
        background: var(--cream);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        letter-spacing: -0.005em;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 18px 22px;
      }
      .mark { flex-shrink: 0; display: block; }
      .wordmark { font-family: var(--display); font-size: 22px; line-height: 1; }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 9vh 20px 64px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--hairline);
        border-radius: 14px;
        padding: 32px 28px 28px;
        box-shadow: 0 1px 1px rgba(26, 22, 18, 0.03), 0 12px 32px -20px rgba(26, 22, 18, 0.16);
        animation: rise 0.28s cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
      .mic {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(221, 105, 54, 0.1);
        color: var(--accent);
        display: grid;
        place-items: center;
        margin-bottom: 16px;
      }
      h1 { font-size: 18px; font-weight: 600; line-height: 1.3; letter-spacing: -0.015em; }
      p { margin-top: 6px; font-size: 13.5px; color: var(--muted); }
      button.primary {
        margin-top: 22px;
        width: 100%;
        height: 40px;
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 10px;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(160, 62, 20, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.16);
        transition: background var(--t), transform var(--t), opacity var(--t);
      }
      button.primary:hover { background: #cf5c2b; }
      button.primary:active { transform: scale(0.985); }
      button.primary:disabled { opacity: 0.55; cursor: default; transform: none; }
      button.skip-link {
        margin-top: 12px;
        background: none;
        border: 0;
        padding: 4px 8px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        transition: color var(--t), background var(--t);
      }
      button.skip-link:hover { color: var(--ink); background: rgba(26, 22, 18, 0.05); }
      button:focus-visible { outline: 2px solid rgba(221, 105, 54, 0.55); outline-offset: 2px; }
      .status {
        display: none;
        margin-top: 14px;
        width: 100%;
        padding: 8px 11px;
        border-radius: 10px;
        font-size: 12.5px;
        line-height: 1.4;
      }
      .status.show { display: block; }
      .status.ok { background: rgba(46, 125, 50, 0.08); color: #2e7d32; }
      .status.err { background: rgba(221, 105, 54, 0.08); border: 1px solid rgba(221, 105, 54, 0.25); color: #b54328; }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
    </style>
  </head>
  <body>
    <header>
      <svg class="mark" viewBox="0 0 128 128" width="26" height="26" aria-hidden="true">
        <rect x="0" y="0" width="128" height="128" rx="28" fill="#dd6936"/>
        <path fill="#f5f1e8" d="
          M26 38 Q26 26 38 26 L52 26 L52 34 L40 34 Q34 34 34 40 L34 52 L26 52 Z
          M26 90 Q26 102 38 102 L52 102 L52 94 L40 94 Q34 94 34 88 L34 76 L26 76 Z
          M102 90 Q102 102 90 102 L76 102 L76 94 L88 94 Q94 94 94 88 L94 76 L102 76 Z
        "/>
        <path fill="#f5f1e8" d="
          M64 40 C67 52, 76 61, 88 64 C76 67, 67 76, 64 88
          C61 76, 52 67, 40 64 C52 61, 61 52, 64 40 Z
        "/>
        <g fill="#ffffff">
          <ellipse cx="84" cy="40" rx="8" ry="7"/>
          <ellipse cx="95" cy="35" rx="10" ry="9"/>
          <ellipse cx="104" cy="40" rx="7" ry="6"/>
          <rect x="80" y="38" width="28" height="9" rx="4"/>
        </g>
      </svg>
      <span class="wordmark">Brief</span>
    </header>
    <main class="wrap">
      <div class="card">
        <span class="mic" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
          </svg>
        </span>
        <h1>Allow the microphone</h1>
        <p>Brief records your voice with the video.</p>
        <button id="grantBtn" class="primary">Grant microphone access</button>
        <button id="skipBtn" class="skip-link" type="button" hidden>Continue without microphone</button>
        <div id="status" class="status"></div>
      </div>
    </main>
    <script type="module" src="permission.js"></script>
  </body>
</html>
