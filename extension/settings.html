<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Brief — Settings</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      :root {
        --cream: #f5f1e8;
        --cream-2: #efe9dc;
        --ink: #1a1612;
        --muted: #8a8378;
        --accent: #dd6936;
        --success: #16a34a;
        --hairline: rgba(26, 22, 18, 0.12);
        --display: 'Instrument Serif', Georgia, serif;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background: var(--cream);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.5;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 480px; margin: 0 auto; padding: 44px 28px 80px; }

      /* Header — logo on the left, info icon on the right */
      header {
        display: flex; align-items: center; gap: 12px;
        padding-bottom: 18px; margin-bottom: 28px;
        border-bottom: 1px solid var(--hairline);
      }
      .mark { flex-shrink: 0; display: block; filter: drop-shadow(0 2px 6px rgba(26,22,18,0.18)); }
      .wordmark {
        flex: 1;
        font-family: var(--display); font-size: 24px;
        letter-spacing: -0.02em; line-height: 1;
      }
      .info-link {
        flex-shrink: 0;
        display: inline-flex; align-items: center; justify-content: center;
        width: 32px; height: 32px;
        border-radius: 8px;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        text-decoration: none;
        transition: color 0.13s, background 0.13s, border-color 0.13s, transform 0.08s;
      }
      .info-link:hover {
        color: var(--accent);
        background: rgba(255, 255, 255, 0.6);
        border-color: var(--hairline);
      }
      .info-link:active { transform: translateY(1px); }

      /* Title block */
      h1 {
        font-family: var(--display); font-weight: 400;
        font-size: 28px; line-height: 1.12; letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      h1 em { font-style: italic; color: var(--accent); }
      .lede {
        font-family: var(--display); font-style: italic;
        font-size: 13.5px; color: var(--muted); margin-bottom: 20px; line-height: 1.55;
      }

      /* Connection card */
      .card {
        background: rgba(255,255,255,0.6);
        border: 1px solid var(--hairline);
        border-radius: 13px;
        padding: 18px 18px 20px;
      }
      .conn-row {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 14px;
      }
      .conn-label { font-size: 13px; color: var(--ink); }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 11px; padding: 3px 10px; border-radius: 999px;
        border: 1px solid var(--hairline);
      }
      .badge.connected {
        color: var(--success);
        border-color: rgba(22,163,74,0.35);
        background: rgba(22,163,74,0.10);
      }
      .badge.disconnected {
        color: var(--muted);
        background: rgba(26,22,18,0.04);
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
      .dot.connected { background: var(--success); }
      .dot.disconnected { background: var(--muted); }

      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      button.btn, a.btn {
        font-family: var(--mono); font-size: 12.5px;
        padding: 9px 16px; border-radius: 9px;
        cursor: pointer; text-decoration: none;
        border: 1px solid var(--hairline);
        transition: background 0.13s, border-color 0.13s, color 0.13s, transform 0.08s;
        display: inline-flex; align-items: center; gap: 6px;
      }
      button.btn:active, a.btn:active { transform: translateY(1px); }
      .btn.primary {
        background: var(--accent); color: #fff; border-color: var(--accent);
      }
      .btn.primary:hover { background: #c95a2b; border-color: #c95a2b; }
      .btn.ghost {
        background: rgba(255,255,255,0.6); color: var(--ink);
      }
      .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
      .btn.danger {
        background: transparent; color: var(--muted); border-color: transparent;
        padding-left: 6px; padding-right: 6px;
      }
      .btn.danger:hover { color: var(--accent); }

      .manage {
        margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.6;
      }
      .manage a { color: var(--accent); text-decoration: none; }
      .manage a:hover { text-decoration: underline; }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <svg class="mark" viewBox="0 0 128 128" width="36" height="36" aria-hidden="true">
          <rect x="0" y="0" width="128" height="128" rx="28" fill="#dd6936"/>
          <path fill="#f5f1e8" d="
            M26 38 Q26 26 38 26 L52 26 L52 34 L40 34 Q34 34 34 40 L34 52 L26 52 Z
            M102 38 Q102 26 90 26 L76 26 L76 34 L88 34 Q94 34 94 40 L94 52 L102 52 Z
            M26 90 Q26 102 38 102 L52 102 L52 94 L40 94 Q34 94 34 88 L34 76 L26 76 Z
            M102 90 Q102 102 90 102 L76 102 L76 94 L88 94 Q94 94 94 88 L94 76 L102 76 Z
          "/>
          <path fill="#f5f1e8" d="
            M64 40 C67 52, 76 61, 88 64 C76 67, 67 76, 64 88
            C61 76, 52 67, 40 64 C52 61, 61 52, 64 40 Z
          "/>
        </svg>
        <span class="wordmark">Brief</span>
        <a
          href="https://get-brief.app/"
          target="_blank"
          rel="noopener noreferrer"
          class="info-link"
          title="How Brief works"
          aria-label="How Brief works — opens get-brief.app"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </a>
      </header>

      <section>
        <h1>Brief <em>Cloud</em></h1>
        <p class="lede">Briefs are written up and filed in the cloud.</p>

        <div class="card">
          <div class="conn-row">
            <span class="conn-label">Connection</span>
            <!-- Connected -->
            <span id="badgeConnected" class="badge connected hidden">
              <span class="dot connected"></span>Connected ✓
            </span>
            <!-- Not connected -->
            <span id="badgeDisconnected" class="badge disconnected hidden">
              <span class="dot disconnected"></span>Not connected
            </span>
          </div>

          <!-- Connected actions -->
          <div id="actionsConnected" class="actions hidden">
            <button id="openDashboard" type="button" class="btn primary">Open dashboard →</button>
            <button id="disconnect" type="button" class="btn danger">Disconnect</button>
          </div>

          <!-- Disconnected actions -->
          <div id="actionsDisconnected" class="actions hidden">
            <button id="connect" type="button" class="btn primary">Connect to Brief Cloud</button>
          </div>
        </div>

        <p class="manage">
          Manage your account, connections &amp; ticket preferences in the
          <a id="dashboardLink" href="#" target="_blank" rel="noopener noreferrer">Brief Cloud dashboard</a>.
        </p>
      </section>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
