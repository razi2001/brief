<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Brief</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="bar.css" />
  </head>
  <body class="state-loading">
    <div id="root">
      <!-- One small glass pill; its content swaps per state. The whole pill
           drags (its buttons excepted). -->
      <div class="bar">
        <!-- LOADING (Chrome's picker is up) -->
        <div data-state="loading" class="state-inner">
          <div class="spinner"></div>
          <span class="state-text">Starting</span>
        </div>

        <!-- COUNTDOWN (pre-roll: 3·2·1, before capture begins) -->
        <div data-state="countdown" class="state-inner">
          <div class="cd">
            <svg class="cd-ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" /></svg>
            <span class="cd-num" id="cdNum">3</span>
          </div>
          <button id="cdCancelBtn" class="icon-btn" title="Cancel" aria-label="Cancel">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <!-- RECORDING -->
        <div data-state="recording" class="state-inner">
          <span class="rec"><i class="rec-dot"></i><span class="timer" id="timer">00:00</span></span>
          <div class="wave" id="wave">
            <div class="wave-bars" id="waveBars" aria-hidden="true"></div>
          </div>
          <button id="muteBtn" class="icon-btn mic" title="Mute mic" aria-label="Mute mic">
            <svg class="on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
            <svg class="off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 9.3V5.5a3 3 0 0 0-5.7-1.3M9 9v2.5a3 3 0 0 0 4.6 2.5M18.5 11a6.5 6.5 0 0 1-1.1 3.6M5.5 11a6.5 6.5 0 0 0 10 5.5M12 17.5V21M3 3l18 18"/></svg>
          </button>
          <button id="stopBtn" class="stop-btn" title="Stop" aria-label="Stop">
            <span class="stop-square"></span>
          </button>
        </div>

        <!-- SAVING -->
        <div data-state="saving" class="state-inner">
          <div class="spinner"></div>
          <span class="state-text">Saving</span>
        </div>

        <!-- SAVED - auto-dismiss after 5s -->
        <div data-state="saved" class="state-inner">
          <span class="badge ok">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
          </span>
          <span class="state-text">Copied</span>
          <button id="closeBtn" class="icon-btn" title="Dismiss" aria-label="Dismiss">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <!-- INBOXED - landed on the brief -->
        <div data-state="inboxed" class="state-inner">
          <span class="badge ok">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
          </span>
          <span class="state-text">Saved</span>
          <button id="inboxCloseBtn" class="icon-btn" title="Done" aria-label="Done">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <!-- CANCELLED - auto-dismiss after 2s -->
        <div data-state="cancelled" class="state-inner">
          <span class="badge">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </span>
          <span class="state-text">Discarded</span>
        </div>

        <!-- ERROR -->
        <div data-state="error" class="state-inner">
          <span class="badge warn">!</span>
          <span class="state-text err" id="errText">-</span>
          <button id="errCloseBtn" class="icon-btn" title="Dismiss" aria-label="Dismiss">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>
    </div>

    <video id="preview" autoplay muted playsinline style="display:none"></video>
    <script type="module" src="bar.js"></script>
  </body>
</html>
