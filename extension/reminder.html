<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Brief</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      :root { --cream:#f5f1e8; --ink:#1a1612; --muted:#7d766b; --accent:#dd6936; --hairline:rgba(26,22,18,.12);
        --sans:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
      * { box-sizing:border-box; margin:0; padding:0; }
      html, body { background:var(--cream); }
      body { width:260px; padding:12px 10px 12px 12px; font-family:var(--sans); letter-spacing:-.005em; color:var(--ink); -webkit-font-smoothing:antialiased; }
      .row { display:flex; align-items:center; gap:10px; }
      .mark { width:26px; height:26px; flex:0 0 auto; }
      .text { flex:1; min-width:0; font-size:14px; font-weight:600; line-height:1.3; color:var(--ink); overflow-wrap:anywhere; }
      .x { all:unset; cursor:pointer; display:grid; place-items:center; width:24px; height:24px; border-radius:7px; color:var(--muted); flex:0 0 auto; }
      .x:hover { color:var(--ink); background:rgba(26,22,18,.06); }
      .go { all:unset; cursor:pointer; box-sizing:border-box; display:block; width:100%; margin-top:10px; height:34px; line-height:34px; padding:0 12px; border-radius:9px;
        background:var(--accent); color:#fff; font-size:13px; font-weight:600; text-align:center;
        box-shadow:0 1px 2px rgba(160,62,20,.28), inset 0 1px 0 rgba(255,255,255,.16); }
      .go:hover { background:#cf5c2b; }
      button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    </style>
  </head>
  <body>
    <div class="row">
      <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
        <rect width="128" height="128" rx="28" fill="#dd6936"/>
        <path fill="#f5f1e8" d="M26 38 Q26 26 38 26 L52 26 L52 34 L40 34 Q34 34 34 40 L34 52 L26 52 Z M26 90 Q26 102 38 102 L52 102 L52 94 L40 94 Q34 94 34 88 L34 76 L26 76 Z M102 90 Q102 102 90 102 L76 102 L76 94 L88 94 Q94 94 94 88 L94 76 L102 76 Z"/>
        <path fill="#f5f1e8" d="M64 40 C67 52, 76 61, 88 64 C76 67, 67 76, 64 88 C61 76, 52 67, 40 64 C52 61, 61 52, 64 40 Z"/>
        <g fill="#ffffff">
          <ellipse cx="84" cy="40" rx="8" ry="7"/>
          <ellipse cx="95" cy="35" rx="10" ry="9"/>
          <ellipse cx="104" cy="40" rx="7" ry="6"/>
          <rect x="80" y="38" width="28" height="9" rx="4"/>
        </g>
      </svg>
      <p class="text" id="text">Seen a bug?</p>
      <button class="x" id="close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <button class="go" id="go" type="button">Brief it</button>
    <script type="module" src="reminder.js"></script>
  </body>
</html>
