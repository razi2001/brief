<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=360, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Brief</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app" id="app">
      <header class="header">
        <span class="mark" id="brandMark" aria-hidden="true">
          <svg viewBox="0 0 128 128" width="26" height="26">
            <rect x="0" y="0" width="128" height="128" rx="28" fill="#dd6936"/>
            <path fill="#f5f1e8" d="
              M26 38 Q26 26 38 26 L52 26 L52 34 L40 34 Q34 34 34 40 L34 52 L26 52 Z
              M26 90 Q26 102 38 102 L52 102 L52 94 L40 94 Q34 94 34 88 L34 76 L26 76 Z
              M102 90 Q102 102 90 102 L76 102 L76 94 L88 94 Q94 94 94 88 L94 76 L102 76 Z"/>
            <path fill="#f5f1e8" d="M64 40 C67 52, 76 61, 88 64 C76 67, 67 76, 64 88 C61 76, 52 67, 40 64 C52 61, 61 52, 64 40 Z"/>
            <g fill="#ffffff">
              <ellipse cx="84" cy="40" rx="8" ry="7"/>
              <ellipse cx="95" cy="35" rx="10" ry="9"/>
              <ellipse cx="104" cy="40" rx="7" ry="6"/>
              <rect x="80" y="38" width="28" height="9" rx="4"/>
            </g>
          </svg>
        </span>
        <h1 class="title">What's the <em>brief</em>?</h1>
        <div class="header-actions">
          <button class="hbtn reset-btn" id="resetBtn" type="button" aria-label="Reset brief" title="Reset brief">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.4 2.6L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="hbtn cloud-btn" id="briefCloudBtn" aria-label="Open Brief" title="Brief">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
            <span class="cloud-label">Connect</span>
          </button>
        </div>
      </header>

      <div class="err-bar" id="errBar"></div>

      <!-- The brief. First the way that makes the best ticket (a video with
           your voice on it), saying what it gives; then what you captured;
           then the other ways, by name; then the words. -->
      <section class="composer">
        <!-- The evidence of this brief, in one card: what you captured, then the
             ways to add more (open by itself while there is nothing yet). -->
        <div class="ev-head" id="evHead" hidden><span class="ev-head-t">Evidence</span><button class="ev-add" id="evAdd" type="button" aria-haspopup="dialog" aria-label="Add evidence" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button></div>
        <div class="ev-card" id="evCard">
          <div class="gallery" id="gallery"></div>
          <div class="ev-ways" id="evWays">
            <div class="ev-ways-in" id="ways">
              <button class="ev-way ev-rec" id="recMain" type="button" title="Record the screen and talk: Brief writes the ticket from it"><span class="ev-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg></span><span class="ev-t"><b>Record and talk</b><small>Brief writes it</small></span></button>
              <div class="ev-way-card" id="shotRow">
              <div class="ev-way-split">
                <button class="ev-way" id="wayShot" type="button" title="Screenshot: mark what is wrong on it"><span class="ev-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span><span class="ev-t"><b>Screenshot</b><small>Mark what is wrong on it</small></span></button>
                <button class="way-opt" id="shotOpt" type="button" aria-label="Screenshot time delay" aria-expanded="false"><span class="way-opt-v"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
              </div>
              </div>
              <button class="ev-way" id="wayRep" type="button" title="The last minute: what just happened in this tab"><span class="ev-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.4 2.6L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></span><span class="ev-t"><b>Last minute</b><small>Replay this tab</small></span></button>
              <div class="opt-row" id="shotOptRow" inert>
                <div class="opt-in"><span class="opt-l">Time delay</span>
                  <div class="segm" id="shotDelay" role="radiogroup" aria-label="Time delay"><button type="button" data-d="0">Off</button><button type="button" data-d="3">3s</button><button type="button" data-d="6">6s</button></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="ai-wrap" id="descWrap">
          <textarea class="ai-field has-mic" id="descField" rows="1" placeholder="What went wrong? What did you expect?" spellcheck="true"></textarea>
        </div>
        <div class="sheet-fields" id="kvList"></div>
        <span id="evCount" hidden>0</span>
      </section>

      <div class="create-wrap" id="createWrap">
        <div class="bash-row" id="bashRow" hidden>
          <span class="bash-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></span>
          <span class="bash-txt"><span class="bash-label">Quality competition <span class="bash-timer" id="bashTimer"></span></span><span class="bash-name" id="bashName"></span></span>
          <button class="switch on" id="bashSwitch" type="button" role="switch" aria-checked="true" aria-label="Count this brief for the quality competition"><span class="knob"></span></button>
        </div>
        <div class="inflight" id="inflight" hidden></div>
        <button class="reconnect-btn" id="reconnectBtn" type="button" hidden><span class="reconnect-dot" aria-hidden="true"></span><span class="reconnect-label">Reconnect</span></button>
        <div class="create-split" id="createSplit">
          <button class="cta primary" id="createBtn" type="button"><span class="ctk-label">Create ticket</span></button>
          <button class="cta primary caret" id="createMenuBtn" type="button" aria-label="Choose what this button does" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
        </div>
        <div class="create-menu" id="createMenu" role="menu" aria-label="What Create does"></div>
      </div>
    </main>

    <div class="scrim" id="scrim"></div>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="handle"></div>
      <div class="sheet-head">
        <div class="sheet-title" id="sheetTitle"></div>
        <button class="sheet-action" id="sheetAction" type="button" hidden></button>
        <button class="sheet-close" id="sheetClose" aria-label="Close" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>

    <div class="toast" id="toast"></div>

    <input type="file" id="filePick" hidden multiple />
    <video id="probeVideo" muted playsinline preload="metadata" hidden></video>

    <div id="exportDone" class="export-done" hidden>
      <div class="export-done-inner">
        <span class="export-done-check">✓</span>
        <p class="export-done-title">Queued</p>
        <p class="export-done-sub">Opening your tickets…</p>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
